name: Release

# Tag scheme (one repo, three packages):
#   python-vX.Y.Z   this workflow builds and publishes viktorbarzin-telemetry to PyPI
#   go/vX.Y.Z       Go module github.com/ViktorBarzin/telemetry/go; the tag is the
#                   release, the Go module proxy needs nothing else
#   android-vX.Y.Z  JitPack builds com.github.ViktorBarzin:telemetry:android-vX.Y.Z
#                   on first request, using jitpack.yml
#
# PyPI uses trusted publishing (OIDC), so there is no API token. The PyPI
# project's trusted publisher names this repository, this workflow file and
# the `pypi` environment.
#
# Two jobs, so the OIDC token is out of reach of the build and test
# dependencies: build has no id-token; publish runs only the PyPI action.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "python-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: python -m pip install --upgrade "pip>=25.1" build
      - run: python -m pip install -e . --group dev
      - run: pytest
      - run: mypy
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viktorbarzin-telemetry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
